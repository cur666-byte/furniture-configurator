<!-- components/editor2d/editor2d.html -->
<div class="editor-2d-container">
    <!-- Левая панель инструментов 2D-черчения -->
    <aside class="editor-sidebar">
        <h3>Инструменты 2D</h3>
        <div class="tool-section">
            <button class="tool-btn active" id="tool-pencil">✏️ Карандаш</button>
            <button class="tool-btn" id="tool-rect-shape">🟩 Прямоугольник</button>
        </div>
        
        <div class="info-section">
            <h4>Параметры комнаты</h4>
            <div class="param-row">
                <label>Высота (см):</label>
                <input type="number" id="info-height" value="250" disabled>
            </div>
            <div class="param-row">
                <label>Толщина (см):</label>
                <input type="number" id="info-thickness" value="20" disabled>
            </div>
            <p id="wall-len-info">Длина: <span class="highlight">—</span></p>
        </div>

        <div class="hint-section">
            💡 <b>Карандаш:</b> кликайте для создания углов контура без остановки.<br><br>
            ⌨️ Наведите мышь в нужную сторону и <b>введите длину на клавиатуре</b> + Enter!
        </div>

        <button class="clear-btn" id="btn-clear-canvas">🗑️ Очистить всё</button>
        <button class="next-step-btn" id="btn-to-3d">Готово, в 3D →</button>
    </aside>

    <!-- Область интерактивного холста Canvas -->
    <div class="canvas-wrapper">
        <canvas id="floorplan-canvas"></canvas>
    </div>
</div>
